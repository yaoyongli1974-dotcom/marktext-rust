name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装 Linux 图形依赖
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # The name servers of the runner sometimes fail to resolve the
          # Ubuntu mirrors for a moment, and apt gives up right away. The
          # mirror is tried again instead of failing the whole run.
          updated=0
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update -o Acquire::Retries=5; then
              updated=1
              break
            fi
            echo "apt-get update 失败（第 ${attempt} 次），等 15 秒后重试"
            sleep 15
          done
          if [ "$updated" -ne 1 ]; then
            echo "镜像源一直解析不了，放弃安装" >&2
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libssl-dev pkg-config

      # The cargo invocations are written for bash on purpose: PowerShell 7.3
      # treats a bare `--` as the stop-parsing token and would swallow the
      # `--` that separates cargo's own flags from the rustc flags.
      - name: 格式检查
        shell: bash
        run: cargo fmt --all -- --check

      - name: 静态检查
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元与往返测试
        shell: bash
        run: cargo test --workspace

      - name: 构建全部目标
        shell: bash
        run: cargo build --workspace --all-targets
