name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装 Linux 图形依赖
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail

          # GitHub 的 runner 偶尔解析不了 Ubuntu 官方域名（archive.ubuntu.com
          # 等），而 GitHub 自己的域名却一切正常，于是 apt 装不上图形依赖，
          # 整个构建就卡在这里。依次换几个镜像域名试试，总有一个能通。
          set_mirror() {
            local base="$1"
            local pattern='https?://(archive|security|azure\.archive|mirror\.gcr\.com|mirrors\.edge\.kernel\.org)[^ ]*/ubuntu/?'
            # 分隔符用 #：正则里有 | （ERE 的「或」），用 | 会撞上分隔符。
            sudo sed -i -E "s#$pattern#${base}#g" /etc/apt/sources.list 2>/dev/null || true
            sudo sed -i -E "s#$pattern#${base}#g" /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          }

          updated=0
          for base in \
            "https://mirror.gcr.com/ubuntu/" \
            "https://mirrors.edge.kernel.org/ubuntu/" \
            "http://azure.archive.ubuntu.com/ubuntu/"
          do
            set_mirror "$base"
            for attempt in 1 2 3; do
              if sudo apt-get update -o Acquire::Retries=3; then
                updated=1
                break 2
              fi
              echo "apt-get update 失败（${base}，第 ${attempt} 次），等 10 秒后重试"
              sleep 10
            done
            echo "镜像 ${base} 不通，换下一个"
          done

          if [ "$updated" -ne 1 ]; then
            echo "所有镜像都解析不了，无法安装依赖" >&2
            exit 1
          fi

          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libssl-dev pkg-config

      # The cargo invocations are written for bash on purpose: PowerShell 7.3
      # treats a bare `--` as the stop-parsing token and would swallow the
      # `--` that separates cargo's own flags from the rustc flags.
      - name: 格式检查
        shell: bash
        run: cargo fmt --all -- --check

      - name: 静态检查
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元与往返测试
        shell: bash
        run: cargo test --workspace

      - name: 构建全部目标
        shell: bash
        run: cargo build --workspace --all-targets
