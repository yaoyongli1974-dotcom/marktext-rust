name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装 Linux 图形依赖
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -uo pipefail

          # 先看看哪些域名能解析：runner 偶尔解析不了 Ubuntu 官方域名，
          # 而 GitHub 自己的域名却一切正常。
          echo "=== DNS 诊断 ==="
          for host in archive.ubuntu.com mirror.gcr.com mirrors.edge.kernel.org \
                      security.ubuntu.com crates.io github.com; do
            if getent hosts "$host" >/dev/null 2>&1; then
              echo "  $host  能解析"
            else
              echo "  $host  解析不了"
            fi
          done

          # 换几个镜像域名依次试，每个都有时间上限，免得卡在那里不动。
          set_mirror() {
            local base="$1"
            # 分隔符用 #：正则里有 | （ERE 的「或」），用 | 会撞上分隔符。
            local pattern='https?://(archive|security|azure\.archive|mirror\.gcr\.com|mirrors\.edge\.kernel\.org)[^ ]*/ubuntu/?'
            sudo sed -i -E "s#$pattern#${base}#g" /etc/apt/sources.list 2>/dev/null || true
            sudo sed -i -E "s#$pattern#${base}#g" /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          }

          updated=0
          for base in \
            "https://mirror.gcr.com/ubuntu/" \
            "https://mirrors.edge.kernel.org/ubuntu/" \
            "http://azure.archive.ubuntu.com/ubuntu/"
          do
            set_mirror "$base"
            if timeout 150 sudo apt-get update -o Acquire::Retries=2; then
              updated=1
              break
            fi
            echo "镜像 ${base} 不通，换下一个"
          done

          # 装不上也不阻断：winit 与 glutin 在 Linux 上是运行时动态加载的，
          # 未必需要这些开发包。装不上就直接试着编译，让编译器说话。
          if [ "$updated" -eq 1 ]; then
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
              libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
              libwayland-dev libssl-dev pkg-config \
              || echo "依赖没装上，接着试着编译"
          else
            echo "镜像源都解析不了，直接试着编译"
          fi

      # The cargo invocations are written for bash on purpose: PowerShell 7.3
      # treats a bare `--` as the stop-parsing token and would swallow the
      # `--` that separates cargo's own flags from the rustc flags.
      - name: 格式检查
        shell: bash
        run: cargo fmt --all -- --check

      - name: 静态检查
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元与往返测试
        shell: bash
        run: cargo test --workspace

      - name: 构建全部目标
        shell: bash
        run: cargo build --workspace --all-targets
